);font-size:38px;font-weight:800;color:#fff;-webkit-text-stroke:2px #3A1A00;paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.35);white-space:nowrap;opacity:0;transition:opacity .2s;z-index:3}#pop.on{opacity:1;animation:popin .35s var(--ease)}@keyframes popin{0%{transform:translate(-50%) scale(.6)}}#wrong{position:fixed;top:38%;left:50%;transform:translate(-50%);background:#e53935;color:#fff;font-size:30px;font-weight:800;padding:4px 22px;border-radius:16px;border:3px solid #fff;display:none}#wrong.on{display:block}.ctrl{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:14px;pointer-events:auto}#steer{left:max(16px,env(safe-area-inset-left))}#acts{right:max(16px,env(safe-area-inset-right));align-items:flex-end}.pad{width:92px;height:92px;border-radius:28px;background:#ffffff47;border:3px solid rgba(255,255,255,.65);color:#fff;font-size:40px;font-weight:800;display:grid;place-items:center;backdrop-filter:blur(2px);transition:transform .08s,background .08s}.pad.on{transform:scale(.92);background:#ffffff80}#brake{width:74px;height:74px;font-size:28px;border-radius:22px;line-height:1}#brake small{display:block;font-size:13px;line-height:1;margin-top:-4px}#brake.drift{background:#50aaff8c}#brake.drift.hot{background:#ff8c28b3}#fire{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffb070,#ff5a1a);border-color:#fff;font-size:50px;box-shadow:0 6px #78280099}#fire.empty{background:#fff3;border-color:#ffffff80;font-size:22px;box-shadow:none}#fire.roll{animation:roll .09s linear infinite}@keyframes roll{50%{transform:rotate(10deg) scale(.95)}}#keys{position:fixed;bottom:12px;left:50%;transform:translate(-50%);color:#fff;font-size:15px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.7);display:none;white-space:nowrap}@media(hover:hover)and (pointer:fine){.ctrl .pad:not(#fire){display:none}#keys{display:block}#fire{width:90px;height:90px;font-size:40px}}#tags{position:fixed;inset:0;pointer-events:none;ove <body>
<canvas id="gl"></canvas>
<div class="top"><a class="ib" href="../" id="home" aria-label="Kembali ke Ulin">⌂</a><button class="ib" id="mute" aria-label="Suara">🔊</button></div>
<div class="layer on dim" id="scrTitle">
<div class="title">Gaspol!<small>Adu Bajaj</small></div>
<div class="modes" role="group" aria-label="Mode">
<button class="mode" id="mRace" aria-pressed="true"><div class="ic">🏁</div><b>Balapan</b><span>Sirkuit kota, siapa duluan finis</span></button>
<button class="mode" id="mArena" aria-pressed="false"><div class="ic">💥</div><b>Adu Arena</b><span>Paling banyak kena, dia juaranya</span></button>
</div>
<div class="opts">
<div class="seg" role="group" aria-label="Lawan"><button id="lvSantai" aria-pressed="true">Lawan santai</button><button id="lvSeru" aria-pressed="false">Lawan jago</button></div>
<div class="seg" role="group" aria-label="Durasi"><button id="dShort" aria-pressed="true">3 putaran</button><button id="dLong" aria-pressed="false">5 putaran</button></div>
</div>
<div class="row"><button class="btn" id="play">Main ▶</button><button class="btn blue" id="online">🌐 Online</button></div>
<div class="best" id="best"></div>
</div>
<div class="layer dim" id="scrOnline">
<div class="card" id="onBody"></div>
<div class="row" style="margin-top:16px"><button class="btn small" id="onBack">‹ Kembali</button></div>
</div>
<div class="layer" id="scrCount"><div class="count" id="count">3</div></div>
<div id="hud">
<div id="tags"></div>
<canvas id="map" width="224" height="224" aria-hidden="true"></canvas>
<div id="pos"></div>
<div id="warn">⚠ Awas roket!</div>
<div id="wrong">↺ Salah arah!</div>
<div id="timer">2:00</div>
<div id="board"></div>
<div id="pop"></div>
<div class="ctrl" id="steer"><button class="pad" id="left" aria-label="Belok kiri">◀</button><button class="pad" id="right" aria-label="Belok kanan">▶</button></div>
<div class="ctrl" id="acts"><button class="pad" id="brake" aria-label="Rem atau ngepot">▼<small>ngepot</small></button><button class="pad empty" id="fire" aria-label="Tembak">kosong</button></div>
<div id="keys">← → belok · tahan ↓ sambil belok = ngepot, lepas = turbo · Spasi tembak</div>
<div id="net"></div>
</div>
<div class="layer dim" id="scrEnd">
<div class="card">
<h2 id="endTitle">Juara!</h2>
<div class="stars" id="endStars"></div>
<ol class="rank" id="endRank"></ol>
<p class="onote" id="endNote"></p>
</div>
<div class="row" style="margin-top:18px" id="endBtns"></div>
</div>
<div id="rot" aria-hidden="true">📱↻ Putar HP ke samping supaya lebih besar</div>
<style>#rot{display:none}@media(orientation:portrait)and (max-width:760px){#rot{display:block;position:fixed;left:50%;transform:translate(-50%);top:calc(70px + env(safe-area-inset-top));z-index:20;background:#000000a8;color:#fff;font:700 15px "Baloo 2",system-ui,sans-serif;padding:6px 14px;border-radius:999px;white-space:nowrap;pointer-events:none;animation:rotfade 9s forwards}}@keyframes rotfade{0%,80%{opacity:1}to{opacity:0;visibility:hidden}}</style>
<script src="../lib/bunyi.js"></script>
<script type="module" src="game.js"></script>
</body>
