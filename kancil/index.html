<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Petualangan Si Kancil</title>
<meta name="description" content="Platformer petualangan Si Kancil: kebun timun, sungai buaya, hutan harimau. Bisa dimainkan di HP dan tablet.">
<meta property="og:title" content="Petualangan Si Kancil">
<meta property="og:image" content="https://bukhorizainun.github.io/ulin/kancil/og.png">
<meta property="og:description" content="Bantu Si Kancil melewati kebun timun, sungai buaya, dan hutan harimau. Main di Ulin!">
<meta name="theme-color" content="#16324F">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#16324F;--line:rgba(255,255,255,.35);--btn:rgba(255,255,255,.18);--btn-on:rgba(255,255,255,.45);--jump:#2BB673}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden}
body{display:grid;place-items:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{display:block}
#pad{position:fixed;inset:0;pointer-events:none;display:none;z-index:2}
body.touch.playing #pad{display:block}
#dpad,#kj{pointer-events:auto;position:absolute;touch-action:none}
#dpad{left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:min(44vmin,230px);height:min(26vmin,130px);border-radius:65px;
  background:rgba(255,255,255,.12);border:2px solid var(--line)}
#dpad i{position:absolute;top:50%;width:0;height:0;border:20px solid transparent;margin-top:-20px;opacity:.7;transition:opacity .05s,transform .05s}
#dpad .l{left:14%;border-right-color:#fff;border-left:0}
#dpad .r{right:14%;border-left-color:#fff;border-right:0}
#dpad i.on{opacity:1;transform:scale(1.25);filter:drop-shadow(0 0 6px #fff)}
#knob{position:absolute;left:50%;top:50%;width:min(20vmin,96px);height:min(20vmin,96px);transform:translate(-50%,-50%);border-radius:50%;
  background:rgba(255,255,255,.28);border:2px solid var(--line);pointer-events:none;transition:left .04s}
#kj{right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:min(30vmin,140px);height:min(30vmin,140px);border-radius:50%;
  display:grid;place-items:center;background:color-mix(in srgb,var(--jump) 60%,transparent);border:3px solid var(--line);color:#fff;
  font:800 18px "Baloo 2",system-ui,sans-serif;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .05s,box-shadow .05s}
#kj.on{transform:translateY(4px) scale(.95);box-shadow:0 1px 0 rgba(0,0,0,.25);background:color-mix(in srgb,var(--jump) 85%,transparent)}
#kj b{font-size:34px;line-height:1;display:block;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pad" aria-hidden="true">
  <div id="dpad"><i class="l"></i><i class="r"></i><div id="knob"></div></div>
  <div id="kj"><div><b>⤒</b>Lompat</div></div>
</div>
<script>
'use strict';
// Petualangan Si Kancil: a small platformer for Ulin. All art and sound are made in code.
const W = 960, H = 540, TS = 32, ROWS = 17, STEP = 1 / 60;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let SC = 1, DPR = 1;
function resize() {
  SC = Math.min(innerWidth / W, innerHeight / H); DPR = Math.min(devicePixelRatio || 1, 2);
  cv.style.width = W * SC + 'px'; cv.style.height = H * SC + 'px';
  cv.width = Math.round(W * SC * DPR); cv.height = Math.round(H * SC * DPR);
}
addEventListener('resize', resize); resize();

const FONT = '"Baloo 2", system-ui, sans-serif', PI = Math.PI, TAU = PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const hsh = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = (k) => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let T = 0;

// ---------- save ----------
let SAVE = { stars: [0, 0, 0], muted: false };
try { SAVE = Object.assign(SAVE, JSON.parse(localStorage.getItem('kancil-v1') || '{}')); } catch (_) {}
const store = () => { try { localStorage.setItem('kancil-v1', JSON.stringify(SAVE)); } catch (_) {} };

// ---------- sound ----------
let AC = null, OUT = null, NB = null, nextNote = 0, noteI = 0;
function audioInit() {
  if (!AC) {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    AC = new A(); OUT = AC.createGain(); OUT.gain.value = .5; OUT.connect(AC.destination);
    NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state !== 'running') AC.resume();
}
function tone(f, dur, type = 'square', vol = .12, to = 0, delay = 0) {
  if (!AC || SAVE.muted) return;
  const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(OUT); o.start(t0); o.stop(t0 + dur + .05);
}
function noise(dur, vol = .2, freq = 1000, delay = 0) {
  if (!AC || SAVE.muted) return;
  const t0 = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NB; s.loop = true; f.type = 'bandpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(OUT); s.start(t0); s.stop(t0 + dur + .05);
}
let streak = 0, streakT = 0;
const sfx = {
  jump() { tone(380, .14, 'square', .06, 760); },
  timun() { const f = 988 * Math.pow(1.06, Math.min(streak, 12)); tone(f, .07, 'square', .05); tone(f * 1.5, .1, 'square', .05, 0, .05); },
  stomp() { tone(220, .12, 'square', .12, 90); noise(.08, .15, 600); },
  hurt() { tone(330, .3, 'sawtooth', .1, 110); },
  splash() { noise(.5, .25, 700); tone(500, .25, 'sine', .08, 150); },
  bonk() { tone(160, .08, 'square', .1); },
  flag() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'triangle', .12, 0, i * .08)); },
  win() { [523, 587, 659, 784, 880, 1047, 1319].forEach((f, i) => tone(f, .22, 'triangle', .14, 0, i * .09)); noise(1.2, .15, 900, .5); },
  land() { noise(.05, .06, 300); },
};
// Gentle pentatonic loop in the spirit of gamelan (slendro-like five notes).
const SCALE = [293.66, 329.63, 392, 440, 523.25, 587.33, 659.25];
const MELODY = [4, 3, 2, 3, 4, -1, 2, 1, 0, 1, 2, -1, 4, 5, 6, 5, 4, -1, 3, 2, 1, 2, 0, -1];
function music() {
  if (!AC || SAVE.muted || state !== 'play') return;
  while (nextNote < AC.currentTime + .25) {
    if (nextNote < AC.currentTime) nextNote = AC.currentTime + .05;
    const n = MELODY[noteI % MELODY.length], d = nextNote - AC.currentTime;
    if (n >= 0) { tone(SCALE[n], .5, 'triangle', .035, 0, d); if (noteI % 6 === 0) tone(SCALE[n] / 2, .9, 'sine', .04, 0, d); }
    if (noteI % 2 === 0) tone(1760, .05, 'sine', .012, 0, d);
    noteI++; nextNote += .28;
  }
}

// ---------- input ----------
const inp = { left: false, right: false, jump: false };
let jumpHit = false;
function setJump(v) { if (v && !inp.jump) jumpHit = true; inp.jump = v; }
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump' };
addEventListener('keydown', (e) => {
  audioInit(); document.body.classList.remove('touch');
  const a = KEYMAP[e.code];
  if (a) { e.preventDefault(); if (a === 'jump') setJump(true); else inp[a] = true; }
  if (e.code === 'Escape' || e.code === 'KeyP') togglePause();
  if ((e.code === 'Enter' || e.code === 'Space') && state !== 'play' && !e.repeat) menuEnter();
});
addEventListener('keyup', (e) => { const a = KEYMAP[e.code]; if (a) { if (a === 'jump') setJump(false); else inp[a] = false; } });
addEventListener('blur', () => { inp.left = inp.right = false; setJump(false); });

const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');
addEventListener('touchstart', () => document.body.classList.add('touch'), { passive: true });
const buzz = () => { if (navigator.vibrate) try { navigator.vibrate(8); } catch (_) {} };

// D-pad: one long pill, the thumb slides between left and right without lifting.
const dpad = document.getElementById('dpad'), knob = document.getElementById('knob'), arL = dpad.querySelector('.l'), arR = dpad.querySelector('.r');
let dpadId = null;
function dpadSet(x) {
  const r = dpad.getBoundingClientRect(), k = clamp((x - r.left) / r.width, 0, 1), d = k - .5;
  knob.style.left = (k * 100) + '%';
  const L = d < -.08, R = d > .08;
  if (L !== inp.left || R !== inp.right) buzz();
  inp.left = L; inp.right = R; arL.classList.toggle('on', L); arR.classList.toggle('on', R);
}
function dpadEnd() { dpadId = null; knob.style.left = '50%'; inp.left = inp.right = false; arL.classList.remove('on'); arR.classList.remove('on'); }
dpad.addEventListener('pointerdown', (e) => { e.preventDefault(); audioInit(); dpadId = e.pointerId; dpad.setPointerCapture(e.pointerId); dpadSet(e.clientX); });
dpad.addEventListener('pointermove', (e) => { if (e.pointerId === dpadId) dpadSet(e.clientX); });
for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) dpad.addEventListener(t, (e) => { if (e.pointerId === dpadId) dpadEnd(); });
const kj = document.getElementById('kj');
kj.addEventListener('pointerdown', (e) => { e.preventDefault(); audioInit(); kj.setPointerCapture(e.pointerId); kj.classList.add('on'); setJump(true); buzz(); });
for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) kj.addEventListener(t, () => { kj.classList.remove('on'); setJump(false); });

// ---------- levels ----------
// Coordinates are in tiles; y is the height above the bottom (a ground of height 3 is stood on at y = 3).
const THEMES = {
  sawah: { grass: '#5DBB4C', grass2: '#3F9A3A', dirt: '#9C6B3F', dirt2: '#7E5330', water: ['#4FB3E8', '#2C7FB8'] },
  sungai: { grass: '#62C26A', grass2: '#3E9C4C', dirt: '#8F6A48', dirt2: '#6E4F34', water: ['#3FA9D6', '#1F6E9C'] },
  hutan: { grass: '#4E9F45', grass2: '#2F7531', dirt: '#6E4B32', dirt2: '#523624', water: ['#3A8FB8', '#1D5E80'] },
};
const LEVELS = [
  { name: 'Kebun Timun', theme: 'sawah', w: 124, intro: 'Kumpulkan timun Pak Tani!', build(a) {
    a.gr(0, 17, 3); a.start(9, 3); a.c(5, 4, 3); a.q(9, 6); a.q(10, 6); a.pf(13, 5, 3); a.c(13, 6, 3);
    a.c(18, 5, 3);
    a.gr(21, 38, 3); a.e('siput', 28, 3); a.c(25, 4, 2); a.c(32, 4, 3);
    a.gr(39, 50, 4); a.pf(42, 6, 4); a.c(42, 7, 4); a.e('siput', 47, 4);
    a.gr(51, 54, 3); a.c(55, 5, 3);
    a.gr(58, 74, 3); a.cp(60, 3); a.c(62, 4, 2); a.e('siput', 65, 3); a.q(67, 6); a.e('siput', 71, 3);
    a.gr(75, 77, 4); a.gr(78, 80, 5); a.gr(81, 83, 6); a.c(78, 6, 1); a.c(81, 7, 1); a.c(84, 8, 3);
    a.gr(87, 100, 4); a.sp(91, 4, 2); a.c(91, 6, 2); a.e('siput', 96, 4);
    a.gr(101, 123, 3); a.c(104, 4, 4); a.goal(117, 3);
  } },
  { name: 'Sungai Buaya', theme: 'sungai', w: 118, intro: 'Lompati punggung buaya. Hitung buayanya!', build(a) {
    a.gr(0, 13, 3); a.start(9, 3); a.c(6, 4, 3);
    a.water(14, 49); for (const x of [15, 21, 27, 33, 39, 45]) a.croc(x, 3); for (const x of [19, 25, 31, 37, 43]) a.c(x, 5, 1);
    a.gr(50, 68, 3); a.cp(52, 3); a.c(55, 4, 3); a.e('siput', 58, 3); a.q(62, 6); a.e('siput', 65, 3);
    a.water(69, 95); a.mov(72, 4, 3, 2, 1.1); a.c(72, 6, 2); a.croc(78, 3); a.c(82, 5, 1); a.croc(84, 3); a.c(88, 5, 1); a.croc(90, 3);
    a.gr(96, 117, 3); a.c(99, 4, 4); a.e('siput', 106, 3); a.goal(112, 3);
  } },
  { name: 'Hutan Harimau', theme: 'hutan', w: 130, intro: 'Injak harimau supaya tertidur!', build(a) {
    a.gr(0, 19, 3); a.start(9, 3); a.c(5, 4, 3); a.pf(8, 6, 3); a.c(8, 7, 3); a.e('harimau', 16, 3);
    a.gr(20, 30, 3); a.pf(22, 5, 3); a.pf(26, 8, 3); a.c(26, 9, 3); a.pf(31, 8, 4); a.c(31, 9, 4);
    a.gr(35, 50, 3); a.cp(37, 3); a.sp(41, 3, 2); a.c(41, 5, 2); a.e('harimau', 46, 3);
    a.gr(51, 53, 4); a.gr(54, 64, 5); a.c(55, 6, 3); a.e('siput', 58, 5); a.q(60, 8);
    a.c(65, 7, 4);
    a.gr(69, 80, 5); a.pf(71, 8, 4); a.c(71, 9, 4); a.e('harimau', 75, 5);
    a.gr(81, 83, 4); a.gr(84, 108, 3); a.cp(86, 3); a.e('harimau', 92, 3); a.c(95, 4, 3); a.e('siput', 98, 3); a.sp(102, 3, 2);
    a.gr(109, 129, 3); a.c(112, 4, 4); a.goal(122, 3);
  } },
];
const px = (y) => (ROWS - y) * TS; // tile height -> pixel y of that surface
function buildLevel(i) {
  const D = LEVELS[i], g = Array.from({ length: ROWS }, () => new Array(D.w).fill(0));
  const L = { i, D, w: D.w, g, items: [], ents: [], plats: [], cps: [], water: [], start: null, goal: null, total: 0 };
  const set = (x, y, t) => { if (x >= 0 && x < D.w && y >= 0 && y < ROWS) g[ROWS - 1 - y][x] = t; };
  D.build({
    gr(x0, x1, h) { for (let x = x0; x <= x1; x++) for (let y = 0; y < h; y++) set(x, y, 1); },
    pf(x, y, w) { for (let k = 0; k < w; k++) set(x + k, y, 2); },
    q(x, y) { set(x, y, 4); L.total++; },
    sp(x, y, w = 1) { for (let k = 0; k < w; k++) set(x + k, y, 5); },
    water(x0, x1) { L.water.push([x0, x1]); for (let x = x0; x <= x1; x++) { set(x, 0, 6); set(x, 1, 6); } },
    c(x, y, n = 1) { for (let k = 0; k < n; k++) { L.items.push({ x: (x + k) * TS + 16, y: px(y) + 16 - TS, got: false, ph: hsh(x + k + y * 9) * TAU }); L.total++; } },
    e(type, x, y) { const big = type === 'harimau'; L.ents.push({ type, x: x * TS, y: px(y) - (big ? 30 : 20), w: big ? 44 : 28, h: big ? 30 : 20, vx: big ? -80 : -36, vy: 0, state: 'walk', t: 0 }); },
    croc(x, y) { L.plats.push({ kind: 'croc', x: x * TS, y: px(y), y0: px(y), w: 3 * TS, h: 26, dx: 0, dy: 0, sink: 0, n: L.plats.filter((p) => p.kind === 'croc').length + 1, counted: false, ph: hsh(x) * TAU }); },
    mov(x, y, w, range, speed) { L.plats.push({ kind: 'raft', x: x * TS, x0: x * TS, y: px(y), w: w * TS, h: 14, range: range * TS, speed, dx: 0, dy: 0 }); },
    cp(x, y) { L.cps.push({ x: x * TS, y: px(y), on: false, raise: 0 }); },
    start(x, y) { L.start = { x: x * TS, y: px(y) }; },
    goal(x, y) { L.goal = { x: x * TS, y: px(y) }; },
  });
  L.tiles = prerender(L);
  return L;
}

// ---------- tile art (drawn once per level into an offscreen canvas) ----------
const isGround = (t) => t === 1;
function prerender(L) {
  const c = document.createElement('canvas'); c.width = L.w * TS; c.height = ROWS * TS;
  const x = c.getContext('2d'), th = THEMES[L.D.theme];
  for (let col = 0; col < L.w; col++) if (L.g[ROWS - 1][col] === 0) { // pits: fade to dark so they read as holes
    const g = x.createLinearGradient(0, (ROWS - 4) * TS, 0, ROWS * TS); g.addColorStop(0, 'rgba(10,20,15,0)'); g.addColorStop(1, 'rgba(10,20,15,.75)');
    x.fillStyle = g; x.fillRect(col * TS, (ROWS - 4) * TS, TS, 4 * TS);
  }
  for (let r = 0; r < ROWS; r++) for (let col = 0; col < L.w; col++) {
    const t = L.g[r][col], X = col * TS, Y = r * TS;
    if (t === 1) {
      const top = r === 0 || !isGround(L.g[r - 1][col]);
      x.fillStyle = th.dirt; x.fillRect(X, Y, TS, TS);
      x.fillStyle = th.dirt2; for (let k = 0; k < 3; k++) { x.beginPath(); x.arc(X + 5 + hsh(col * 7 + r * 13 + k) * 22, Y + 8 + hsh(col * 3 + r * 5 + k * 11) * 20, 2.5, 0, TAU); x.fill(); }
      if (col > 0 && !isGround(L.g[r][col - 1])) { x.fillStyle = 'rgba(0,0,0,.18)'; x.fillRect(X, Y, 4, TS); }
      if (col < L.w - 1 && !isGround(L.g[r][col + 1])) { x.fillStyle = 'rgba(0,0,0,.18)'; x.fillRect(X + TS - 4, Y, 4, TS); }
      if (top) {
        x.fillStyle = th.grass2; x.fillRect(X, Y, TS, 12);
        x.fillStyle = th.grass; x.fillRect(X, Y, TS, 9);
        for (let k = 0; k < 4; k++) { x.beginPath(); x.arc(X + 4 + k * 8, Y + 9, 4, 0, PI); x.fill(); }
        if (hsh(col * 31) < .25) { x.fillStyle = ['#FFD23F', '#FF8FAB', '#fff'][Math.floor(hsh(col) * 3)]; x.beginPath(); x.arc(X + 10 + hsh(col * 5) * 12, Y - 2, 3, 0, TAU); x.fill(); x.fillStyle = th.grass2; x.fillRect(X + 9 + hsh(col * 5) * 12, Y, 2, 2); }
      }
    } else if (t === 2) { // bamboo bridge, one-way
      x.fillStyle = 'rgba(0,0,0,.15)'; x.fillRect(X, Y + 12, TS, 4);
      x.fillStyle = '#D9C76A'; x.fillRect(X, Y + 1, TS, 11);
      x.fillStyle = '#B9A44A'; x.fillRect(X, Y + 9, TS, 3); x.fillRect(X + 15, Y + 1, 2, 11);
      x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(X, Y + 3, TS, 2);
    } else if (t === 5) { // thorn bush
      x.fillStyle = '#2F5D2A'; x.beginPath(); x.ellipse(X + 16, Y + 26, 17, 10, 0, PI, TAU); x.fill();
      for (let k = 0; k < 5; k++) { const sx = X + 3 + k * 6.5; x.fillStyle = '#E8E1C7'; x.beginPath(); x.moveTo(sx, Y + 22); x.lineTo(sx + 3, Y + 8 + (k % 2) * 4); x.lineTo(sx + 6, Y + 22); x.fill(); }
      x.fillStyle = '#E63946'; for (let k = 0; k < 3; k++) { x.beginPath(); x.arc(X + 8 + k * 8, Y + 20, 2.5, 0, TAU); x.fill(); }
    }
  }
  return c;
}

// ---------- drawing helpers ----------
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); ctx.fill(); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function text(s, x, y, size, color, o = {}) {
  ctx.font = `${o.weight || 800} ${size}px ${FONT}`; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.sw || size * .18; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function rep(off, sp, fn) { const o = ((off % sp) + sp) % sp, b = Math.floor(off / sp); for (let i = -1; i <= Math.ceil(W / sp) + 1; i++) fn(i * sp - o, b + i); }
function sky(c1, c2) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c1); g.addColorStop(1, c2); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }

}
function win() {
  state = 'win'; st = 0; const r = got / L.total; winStars = r >= .9 ? 3 : r >= .6 ? 2 : 1;

// ---------- screens ----------
function button(label, x, y, w, h, fn, col = '#E63946') {
  ui.push({ x, y, w, h, fn });
  ctx.fillStyle = 'rgba(0,0,0,.2)'; rrect(x, y + 5, w, h, h / 2); ctx.fill();
  ctx.fillStyle = col; rrect(x, y, w, h, h / 2); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke();

}
function starShape(x, y, r, on) {

  ctx.closePath(); ctx.fillStyle = on ? '#FFD23F' : 'rgba(255,255,255,.35)'; ctx.fill(); ctx.strokeStyle = on ? '#E09A00' : 'rgba(0,0,0,.15)'; ctx.lineWidth = 3; ctx.stroke();
}
function panel(x, y, w, h) { ctx.fillStyle = 'rgba(0,0,0,.25)'; rrect(x, y + 8, w, h, 28); ctx.fill(); ctx.fillStyle = '#FFFDF5'; rrect(x, y, w, h, 28); ctx.fill(); }
function drawTitle() {

  ctx.fillStyle = '#5DBB4C'; ctx.fillRect(0, 456, W, 84); ctx.fillStyle = '#3F9A3A'; ctx.fillRect(0, 456, W, 8);

  ui[ui.length - 1] = { x: 360, y: 252, w: 240, h: 76, fn: () => { state = 'select'; st = 0; } };
  text(isTouch ? 'Geser tombol kiri untuk jalan, tombol hijau untuk lompat' : 'Panah kiri/kanan untuk jalan, Spasi untuk lompat', 480, 494, 22, '#fff', { weight: 700, stroke: '#2F7A2E', sw: 5 });
  if (innerHeight > innerWidth) text('Putar HP ke samping supaya lebih besar', 480, 372, 24, '#fff', { stroke: '#16324F', sw: 6 });
  soundBtn();
}
function drawSelect() {
  background('sawah', T * 10); ctx.fillStyle = 'rgba(22,50,79,.35)'; ctx.fillRect(0, 0, W, H);
  text('Pilih Petualangan', 480, 70, 52, '#fff', { stroke: '#16324F', sw: 10 });
  LEVELS.forEach((D, i) => {
    const x = 80 + i * 280, y = 130, w = 240, h = 300, open = i === 0 || SAVE.stars[i - 1] > 0;
    const k = easeOut((st - i * .08) / .4); ctx.save(); ctx.globalAlpha = clamp(k, 0, 1); ctx.translate(0, (1 - k) * 30);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; rrect(x, y + 8, w, h, 24); ctx.fill();

    text(D.name, x + w / 2, y + 226, 30, open ? '#16324F' : '#fff');
    for (let s = 0; s < 3; s++) starShape(x + w / 2 - 36 + s * 36, y + 262, 13, (SAVE.stars[i] || 0) > s);
    if (!open) text('🔒', x + w / 2, y + 90, 60, '#fff');
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; rrect(x, y, w, h, 24); ctx.stroke();

function hud() {
  for (let i = 0; i < 3; i++) { const x = 34 + i * 40, y = 34, on = i < P.hearts; ctx.fillStyle = on ? '#E63946' : 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.moveTo(x, y + 12); ctx.bezierCurveTo(x - 20, y - 2, x - 10, y - 18, x, y - 6); ctx.bezierCurveTo(x + 10, y - 18, x + 20, y - 2, x, y + 12); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke(); }
  ctx.save(); ctx.translate(176, 34); ctx.scale(1.1, 1.1); ctx.translate(-176, -34); drawTimun(176, 34, 0); ctx.restore();
  text(`${got}/${L.total}`, 200, 36, 30, '#fff', { align: 'left', stroke: '#16324F', sw: 6 });
  text(L.D.name, 480, 32, 26, '#fff', { stroke: '#16324F', sw: 6 });
  ctx.fillStyle = 'rgba(255,255,255,.85)'; circle(916, 36, 24); ctx.fillStyle = '#16324F'; ctx.fillRect(906, 24, 7, 24); ctx.fillRect(919, 24, 7, 24);
  ui.push({ x: 880, y: 0, w: 80, h: 76, fn: togglePause });
}
function soundBtn() {
  const x = 916, y = 36; ctx.fillStyle = 'rgba(255,255,255,.85)'; circle(x, y, 24);
  ctx.fillStyle = '#16324F'; ctx.beginPath(); ctx.moveTo(x - 11, y - 5); ctx.lineTo(x - 5, y - 5); ctx.lineTo(x + 2, y - 11); ctx.lineTo(x + 2, y + 11); ctx.lineTo(x - 5, y + 5); ctx.lineTo(x - 11, y + 5); ctx.fill();
  ctx.strokeStyle = '#16324F'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  if (SAVE.muted) { ctx.beginPath(); ctx.moveTo(x + 6, y - 6); ctx.lineTo(x + 14, y + 6); ctx.moveTo(x + 14, y - 6); ctx.lineTo(x + 6, y + 6); ctx.stroke(); }

  ui.push({ x: 880, y: 0, w: 80, h: 76, fn: () => { SAVE.muted = !SAVE.muted; store(); } });
}
function drawWorld() {
  const c = Math.round(cam), sx = shake > 0 && !REDUCED ? rnd(-5, 5) * shake / .3 : 0, sy = shake > 0 && !REDUCED ? rnd(-4, 4) * shake / .3 : 0;
  background(L.D.theme, c);
  ctx.save(); ctx.translate(-c + sx, -4 + sy);

    const x0 = a * TS, x1 = (b + 1) * TS; if (x1 < c - 40 || x0 > c + W + 40) continue;
    const g = ctx.createLinearGradient(0, px(2), 0, ROWS * TS); g.addColorStop(0, th.water[0]); g.addColorStop(1, th.water[1]);

  for (const p of L.plats) if (p.x + p.w > c - 20 && p.x < c + W + 20) (p.kind === 'croc' ? drawCroc : drawRaft)(p);
  for (const [a, b] of L.water) { ctx.fillStyle = 'rgba(255,255,255,.35)'; for (let x = a * TS; x <= (b + 1) * TS; x += 40) ctx.fillRect(x + ((T * 30) % 40), px(2) + 12 + Math.sin(x + T) * 2, 16, 3); ctx.fillStyle = `${th.water[0]}88`; ctx.fillRect(a * TS, px(2) + 14, (b - a + 1) * TS, 8); }

}
function render() {
  ctx.setTransform(SC * DPR, 0, 0, SC * DPR, 0, 0); ui = [];

  if (state === 'title') return drawTitle();
  if (state === 'select') return drawSelect();
  drawWorld();
  if (state === 'intro') {
    const k = easeOut(st / .4), out = st > 1.8 ? 1 - (st - 1.8) / .4 : 1;
    ctx.save(); ctx.globalAlpha = clamp(Math.min(k, out), 0, 1); ctx.translate(480, 250); ctx.scale(.9 + .1 * k, .9 + .1 * k);
    panel(-300, -90, 600, 180); text('Level ' + (L.i + 1), 0, -50, 26, '#E63946'); text(L.D.name, 0, 0, 52, '#16324F'); text(L.D.intro, 0, 50, 24, '#5C677D', { weight: 700 });
    ctx.restore();
  } else if (state === 'oops') {
    ctx.fillStyle = 'rgba(22,50,79,.45)'; ctx.fillRect(0, 0, W, H);
    text('Yah! Coba lagi, ya', 480, 250, 56, '#fff', { stroke: '#16324F', sw: 10 });
  } else if (state === 'pause') {
    ctx.fillStyle = 'rgba(22,50,79,.55)'; ctx.fillRect(0, 0, W, H);
    panel(280, 110, 400, 320); text('Istirahat dulu', 480, 165, 40, '#16324F');
    button('Lanjut ▶', 360, 210, 240, 64, togglePause, '#2BB673');
    button('Pilih level', 360, 290, 240, 56, () => { state = 'select'; st = 0; }, '#16324F');
    button(SAVE.muted ? 'Suara: mati' : 'Suara: hidup', 360, 360, 240, 50, () => { SAVE.muted = !SAVE.muted; store(); }, '#5C677D');
  } else if (state === 'win') {
    const k = easeOut((st - .4) / .5); if (k <= 0) return;
    ctx.save(); ctx.globalAlpha = clamp(k, 0, 1); ctx.translate(0, (1 - k) * 30);
    panel(250, 90, 460, 360);
    const last = L.i === LEVELS.length - 1;
    text(last ? 'Kancil sampai di rumah!' : 'Hebat!', 480, 140, last ? 36 : 52, '#E63946');
    for (let s = 0; s < 3; s++) { const sk = easeOut((st - .8 - s * .25) / .3); ctx.save(); ctx.translate(410 + s * 70, 210); ctx.scale(sk, sk); starShape(0, 0, 28, winStars > s); ctx.restore(); }
    text(`Timun: ${got} dari ${L.total}`, 480, 262, 26, '#16324F', { weight: 700 });
    if (st > 1.6) {
      if (!last) button('Lanjut ▶', 360, 296, 240, 62, () => startLevel(L.i + 1), '#2BB673');
      else button('Pilih level', 360, 296, 240, 62, () => { state = 'select'; st = 0; }, '#2BB673');

}
function togglePause() {
  if (state === 'play') { state = 'pause'; inp.left = inp.right = false; setJump(false); }
  else if (state === 'pause') { state = 'play'; jumpHit = false; }
}
function menuEnter() {
  if (state === 'title') { state = 'select'; st = 0; }
  else if (state === 'select') { let i = 0; while (i + 1 < LEVELS.length && SAVE.stars[i] > 0) i++; startLevel(i); }
  else if (state === 'win' && st > 1.6) { if (L.i < LEVELS.length - 1) startLevel(L.i + 1); else { state = 'select'; st = 0; } }

cv.addEventListener('pointerdown', (e) => {
  e.preventDefault(); audioInit();
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  for (let i = ui.length - 1; i >= 0; i--) { const b = ui[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { tone(660, .06, 'square', .05); b.fn(); return; } }

}, { passive: false });
cv.addEventListener('pointerup', () => { if (state === 'play' && !document.body.classList.contains('touch')) setJump(false); });

// ---------- loop: fixed 60 Hz simulation ----------
let last = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const d = Math.min(.1, Math.max(0, (ts - last) / 1000)); last = ts; acc += d;
  while (acc >= STEP) { update(STEP); acc -= STEP; }

}
requestAnimationFrame(frame);
window.__kancil = { startLevel, get P() { return P; }, get L() { return L; }, get state() { return state; }, set state(v) { state = v; }, inp, setJump, win };
