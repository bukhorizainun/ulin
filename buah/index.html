<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Buah Nusantara</title>
<meta name="description" content="Jatuhkan buah, gabungkan yang sama, dan buat semangka! Dari kelengkeng sampai durian.">
<meta property="og:title" content="Buah Nusantara">
<meta property="og:description" content="Gabungkan buah yang sama sampai jadi semangka. Kenali buah-buahan Indonesia sambil main!">
<meta property="og:image" content="https://bukhorizainun.github.io/ulin/buah/og.png">
<meta name="theme-color" content="#F6E7C8">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6E7C8;--ink:#5A3A1E;--card:#FFF9EC}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Baloo 2",system-ui,sans-serif}
body{display:grid;place-items:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  background:radial-gradient(circle at 20% 20%,#FBEFD6 0 10%,transparent 11%) 0 0/90px 90px,var(--bg)}
canvas{display:block}
.btn{position:fixed;top:max(10px,env(safe-area-inset-top));z-index:3;background:rgba(255,255,255,.75);color:var(--ink);border:0;border-radius:14px;padding:6px 12px;
  font:700 16px "Baloo 2",system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.1);cursor:pointer}
#back{left:max(10px,env(safe-area-inset-left))}
#mute{right:max(10px,env(safe-area-inset-right));width:44px;padding:6px 0}
#toast{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));translate:-50% 0;z-index:4;width:min(440px,calc(100% - 24px));background:var(--card);color:var(--ink);
  border-radius:18px;padding:10px 14px;box-shadow:0 10px 26px rgba(90,58,30,.25);font-size:16px;line-height:1.35;display:none;border:2px solid #F2C14E}
#toast b{color:#C2410C}
</style>
</head>
<body>
<a class="btn" id="back" href="../">← Ulin</a>
<button class="btn" id="mute" aria-label="Suara">🔊</button>
<div id="toast"></div>
<canvas id="c"></canvas>
<script>
'use strict';
// Buah Nusantara: drop fruit, merge equal ones, grow a watermelon. Physics and art written for Ulin.
const W = 480, H = 860, BOX = { l: 34, r: 446, t: 168, b: 770 }, LINE = 214, STEP = 1 / 60, SUB = 4, G = 2400;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let SC = 1, DPR = 1;
function resize() {
  SC = Math.min(innerWidth / W, innerHeight / H); DPR = Math.min(devicePixelRatio || 1, 2);
  cv.style.width = W * SC + 'px'; cv.style.height = H * SC + 'px'; cv.width = Math.round(W * SC * DPR); cv.height = Math.round(H * SC * DPR);
}
addEventListener('resize', resize); resize();
const FONT = '"Baloo 2", system-ui, sans-serif', PI = Math.PI, TAU = PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let T = 0;

// ---------- fruit ladder (radius, colours, fact) ----------
const F = [
  { n: 'Kelengkeng', r: 15, c: '#D9B27C', d: '#B98B52', f: 'Daging kelengkeng bening dan manis. Nama Inggrisnya longan, dari bahasa Tionghoa yang berarti "mata naga".' },
  { n: 'Salak', r: 21, c: '#8A3B2A', d: '#5E2418', f: 'Kulit salak bersisik seperti kulit ular, makanya dalam bahasa Inggris disebut snake fruit.' },
  { n: 'Rambutan', r: 27, c: '#E5484D', d: '#B42318', f: 'Namanya dari kata "rambut", karena kulitnya berambut lebat.' },
  { n: 'Manggis', r: 33, c: '#5B2A55', d: '#3E1A3B', f: 'Ratu buah! Hitung kelopak kecil di bawah buah manggis: jumlahnya sama dengan ruas daging di dalamnya.' },
  { n: 'Jeruk', r: 41, c: '#F59E0B', d: '#D97706', f: 'Jeruk kaya vitamin C yang membantu menjaga daya tahan tubuh.' },
  { n: 'Jambu Air', r: 49, c: '#F472B6', d: '#DB2777', f: 'Jambu air banyak mengandung air, segar dimakan saat cuaca panas.' },
  { n: 'Mangga', r: 57, c: '#FBBF24', d: '#65A30D', f: 'Indonesia punya banyak jenis mangga, misalnya arumanis dan gedong gincu.' },
  { n: 'Pepaya', r: 66, c: '#FB923C', d: '#16A34A', f: 'Buah pepaya membantu pencernaan. Bijinya hitam dan banyak sekali.' },
  { n: 'Nanas', r: 76, c: '#FACC15', d: '#CA8A04', f: 'Nanas tidak tumbuh di pohon. Buahnya muncul dari tengah tanaman pendek di tanah.' },
  { n: 'Durian', r: 88, c: '#A3B93A', d: '#6B7F1A', f: 'Raja buah! Baunya sangat kuat, sampai dilarang dibawa masuk ke beberapa hotel.' },
  { n: 'Semangka', r: 102, c: '#22A34A', d: '#14532D', f: 'Lebih dari 90 persen isi semangka adalah air. Kamu berhasil membuatnya!' },
];
const OPENING = [0, 0, 1, 2, 2, 3]; // the first drops are fixed, then random from the five smallest

// ---------- save ----------
let SAVE = { best: 0, seen: [true], muted: false };
try { SAVE = Object.assign(SAVE, JSON.parse(localStorage.getItem('buah-v1') || '{}')); } catch (_) {}
const store = () => { try { localStorage.setItem('buah-v1', JSON.stringify(SAVE)); } catch (_) {} };

// ---------- sound ----------
let AC = null;
function tone(f, d, type = 'triangle', v = .12, delay = 0, to = 0) {
  if (SAVE.muted) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state !== 'running') AC.resume();
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .05);
  } catch (_) {}
}
const sfx = {
  drop() { tone(330, .1, 'sine', .1, 0, 200); },
  merge(lv) { const f = 330 * Math.pow(1.122, lv); tone(f, .14, 'triangle', .14); tone(f * 1.5, .16, 'triangle', .1, .06); },
  big() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, .25, 'triangle', .14, i * .08)); },
  pop() { tone(rnd(500, 900), .07, 'square', .05); },
  over() { [392, 330, 262].forEach((f, i) => tone(f, .3, 'sine', .12, i * .18)); },
};
const buzz = (ms = 10) => { if (navigator.vibrate) try { navigator.vibrate(ms); } catch (_) {} };
const muteBtn = document.getElementById('mute');
const muteIcon = () => (muteBtn.textContent = SAVE.muted ? '🔇' : '🔊'); muteIcon();
muteBtn.onclick = () => { SAVE.muted = !SAVE.muted; store(); muteIcon(); };
let toastT = 0;
function toast(html, ms = 5200) { const t = document.getElementById('toast'); t.innerHTML = html; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => (t.style.display = 'none'), ms); }

// ---------- state ----------
let popDone = 0, fruits = [], parts = [], floats = [], state = 'play', score = 0, aimX = W / 2, held = null, nextLv = 0, dropN = 0, cool = 0, shake = 0, endT = 0, combo = 0, comboT = 0, warn = 0;
function pickLevel() { const v = dropN < OPENING.length ? OPENING[dropN] : Math.floor(Math.random() * 5); dropN++; return v; }
function newGame() {
  fruits = []; parts = []; floats = []; score = 0; dropN = 0; state = 'play'; cool = 0; combo = 0;
  held = { lv: pickLevel() }; nextLv = pickLevel();
}
function makeFruit(lv, x, y, vx = 0, vy = 0, grow = false) {
  return { lv, x, y, vx, vy, r: grow ? F[lv].r * .5 : F[lv].r, tr: F[lv].r, rot: rnd(-.3, .3), born: T, over: 0, dead: false, squish: grow ? 1 : 0 };
}
function drop() {
  if (state !== 'play' || !held || cool > 0) return;
  const r = F[held.lv].r, x = clamp(aimX, BOX.l + r, BOX.r - r);
  fruits.push(makeFruit(held.lv, x, LINE - 40, 0, 120));
  held = null; cool = .45; sfx.drop(); buzz(6);
}

// ---------- physics: circles with gravity, positional correction and impulses ----------
function physics(dt) {
  const h = dt / SUB, merges = [];
  for (let s = 0; s < SUB; s++) {
    for (const f of fruits) { f.vy += G * h; f.x += f.vx * h; f.y += f.vy * h; f.r += (f.tr - f.r) * Math.min(1, h * 14); }
    for (let it = 0; it < 3; it++) {
      for (let i = 0; i < fruits.length; i++) for (let j = i + 1; j < fruits.length; j++) {
        const a = fruits[i], b = fruits[j]; if (a.dead || b.dead) continue;
        const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r, d2 = dx * dx + dy * dy;
        if (d2 >= rr * rr || d2 === 0) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, ov = rr - d;
        if (a.lv === b.lv) { a.dead = b.dead = true; merges.push([a, b]); continue; }
        const ma = a.r * a.r, mb = b.r * b.r, tot = ma + mb;
        a.x -= nx * ov * mb / tot; a.y -= ny * ov * mb / tot; b.x += nx * ov * ma / tot; b.y += ny * ov * ma / tot;
        const rvx = b.vx - a.vx, rvy = b.vy - a.vy, vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          const k = 1 / ma + 1 / mb, jn = -(1.1 * vn) / k, tx = -ny, ty = nx, vt = rvx * tx + rvy * ty, jt = -vt * .15 / k;
          a.vx -= (jn * nx + jt * tx) / ma; a.vy -= (jn * ny + jt * ty) / ma; b.vx += (jn * nx + jt * tx) / mb; b.vy += (jn * ny + jt * ty) / mb;
        }
      }
      for (const f of fruits) {
        if (f.x - f.r < BOX.l) { f.x = BOX.l + f.r; if (f.vx < 0) f.vx *= -.2; }
        if (f.x + f.r > BOX.r) { f.x = BOX.r - f.r; if (f.vx > 0) f.vx *= -.2; }
        if (f.y + f.r > BOX.b) { f.y = BOX.b - f.r; if (f.vy > 0) f.vy *= -.1; f.vx *= .985; }
      }
    }
    for (const f of fruits) { f.rot += f.vx / f.r * h; f.vx *= .9995; if (Math.abs(f.vx) < 4 && Math.abs(f.vy) < 30) f.vx *= .9; }
  }
  for (const [a, b] of merges) {
    fruits = fruits.filter((f) => f !== a && f !== b);
    const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
    if (a.lv === 10) { // two watermelons vanish in a shower of sparks
      score += 100; burst(x, y, F[10].c, 40, 360); burst(x, y, '#fff', 20, 300); sfx.big(); shake = .5; floatText('+100', x, y - 40, '#22A34A'); continue;
    }
    const lv = a.lv + 1, n = makeFruit(lv, x, y, (a.vx + b.vx) * .3, -60, true); fruits.push(n);
    const pts = (lv * (lv + 1)) / 2; score += pts; // 1, 3, 6, 10, ... like a triangle
    combo = comboT > 0 ? combo + 1 : 1; comboT = 1.1;
    burst(x, y, F[a.lv].c, 10 + lv * 2, 160 + lv * 18); sfx.merge(lv); buzz(lv > 6 ? 30 : 10);
    floatText('+' + pts, x, y - n.tr - 10, '#fff');
    if (combo >= 3) floatText('Kombo x' + combo + '!', x, y - n.tr - 46, '#FFD23F');
    if (lv >= 7) shake = Math.max(shake, .12 + (lv - 7) * .08);
    if (!SAVE.seen[lv]) {
      SAVE.seen[lv] = true; store();
      toast(`Buah baru: <b>${F[lv].n}</b>! ${F[lv].f}`);
      if (lv === 10) { sfx.big(); confetti(); floatText('SEMANGKA!', W / 2, 320, '#22A34A'); }
    }
  }
}

// ---------- particles ----------
function burst(x, y, col, n, sp) { for (let i = 0; i < n; i++) { const a = rnd(0, TAU), v = rnd(sp * .3, sp); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, g: 900, life: rnd(.35, .7), t: 0, col, r: rnd(2.5, 5) }); } }
function confetti() { const c = ['#E5484D', '#FFD23F', '#22A34A', '#4EA8DE', '#F472B6']; for (let i = 0; i < 90; i++) parts.push({ x: rnd(0, W), y: rnd(-60, 0), vx: rnd(-40, 40), vy: rnd(100, 240), g: 60, life: rnd(2, 3.2), t: 0, col: c[i % 5], r: rnd(3, 6), conf: true, rot: rnd(0, TAU), vr: rnd(-6, 6) }); }
function floatText(s, x, y, col) { floats.push({ s, x, y, t: 0, col }); }

// ---------- drawing ----------
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function text(s, x, y, size, col, o = {}) {
  ctx.font = `${o.weight || 800} ${size}px ${FONT}`; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.sw || size * .18; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function face(r, lv, sleepy) {
  const e = Math.max(1.6, r * .08), ex = r * .28, ey = -r * .05;
  ctx.fillStyle = '#2B1A10';
  if (sleepy) { ctx.strokeStyle = '#2B1A10'; ctx.lineWidth = e * .9; ctx.lineCap = 'round'; for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(s * ex, ey, e * 1.3, .15 * PI, .85 * PI); ctx.stroke(); } }
  else { circle(-ex, ey, e); circle(ex, ey, e); ctx.fillStyle = '#fff'; circle(-ex + e * .35, ey - e * .35, e * .38); circle(ex + e * .35, ey - e * .35, e * .38); }
  ctx.strokeStyle = '#2B1A10'; ctx.lineWidth = Math.max(1.4, r * .05); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, ey + r * .1, r * .14, .15 * PI, .85 * PI); ctx.stroke();
  ctx.fillStyle = 'rgba(255,120,120,.35)'; circle(-ex - e * 1.4, ey + r * .15, e * 1.3); circle(ex + e * 1.4, ey + r * .15, e * 1.3);
}
function drawFruit(lv, x, y, r, rot, squish = 0, sleepy = false) {
  const D = F[lv], s = 1 + Math.sin(squish * PI) * .12 * squish;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, 2 - s);
  ctx.fillStyle = 'rgba(0,0,0,.12)'; circle(r * .06, r * .1, r);
  if (lv === 2) { ctx.strokeStyle = D.c; ctx.lineWidth = Math.max(1.5, r * .08); ctx.lineCap = 'round'; for (let k = 0; k < 22; k++) { const a = k * TAU / 22; ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * .9, Math.sin(a) * r * .9); ctx.quadraticCurveTo(Math.cos(a + .2) * r * 1.25, Math.sin(a + .2) * r * 1.25, Math.cos(a + .35) * r * 1.22, Math.sin(a + .35) * r * 1.22); ctx.stroke(); } ctx.strokeStyle = '#84CC16'; ctx.lineWidth = Math.max(1, r * .05); for (let k = 0; k < 22; k += 2) { const a = k * TAU / 22 + .35; ctx.beginPath(); ctx.arc(Math.cos(a) * r * 1.22, Math.sin(a) * r * 1.22, 1, 0, TAU); ctx.stroke(); } }
  if (lv === 9) { ctx.fillStyle = D.d; for (let k = 0; k < 26; k++) { const a = k * TAU / 26; ctx.beginPath(); ctx.moveTo(Math.cos(a - .1) * r * .95, Math.sin(a - .1) * r * .95); ctx.lineTo(Math.cos(a) * r * 1.14, Math.sin(a) * r * 1.14); ctx.lineTo(Math.cos(a + .1) * r * .95, Math.sin(a + .1) * r * .95); ctx.fill(); } }
  const g = ctx.createRadialGradient(-r * .35, -r * .4, r * .1, 0, 0, r);
  g.addColorStop(0, lv === 6 ? '#FDE68A' : lv === 7 ? '#FDBA74' : '#ffffff55'); g.addColorStop(.25, D.c); g.addColorStop(1, lv === 6 || lv === 7 ? D.c : D.d);
  ctx.fillStyle = D.c; circle(0, 0, r); ctx.fillStyle = g; circle(0, 0, r);
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip();
  if (lv === 0) { ctx.fillStyle = 'rgba(120,80,40,.35)'; for (let k = 0; k < 9; k++) circle(Math.cos(k * 2.4) * r * .6, Math.sin(k * 2.4) * r * .6, r * .06); }
  if (lv === 1) { ctx.strokeStyle = 'rgba(30,10,5,.45)'; ctx.lineWidth = 1.2; for (let yy = -r; yy < r; yy += r * .3) for (let xx = -r; xx < r; xx += r * .3) { ctx.beginPath(); ctx.arc(xx + ((yy / (r * .3)) & 1) * r * .15, yy, r * .15, .1 * PI, .9 * PI); ctx.stroke(); } }
  if (lv === 4) { ctx.fillStyle = 'rgba(180,83,9,.25)'; for (let k = 0; k < 20; k++) circle(Math.cos(k * 1.7) * r * .75 * ((k % 3) / 3 + .4), Math.sin(k * 1.7) * r * .75 * ((k % 3) / 3 + .4), r * .035); }
  if (lv === 6) { ctx.fillStyle = 'rgba(101,163,13,.55)'; ctx.beginPath(); ctx.ellipse(r * .45, r * .35, r * .55, r * .45, .5, 0, TAU); ctx.fill(); }
  if (lv === 7) { ctx.fillStyle = 'rgba(22,163,74,.45)'; ctx.beginPath(); ctx.ellipse(-r * .5, -r * .5, r * .6, r * .4, -.6, 0, TAU); ctx.fill(); }
  if (lv === 8) { ctx.strokeStyle = 'rgba(161,98,7,.55)'; ctx.lineWidth = Math.max(1.5, r * .035); for (let k = -6; k <= 6; k++) { ctx.beginPath(); ctx.moveTo(k * r * .3 - r, -r); ctx.lineTo(k * r * .3 + r, r); ctx.moveTo(k * r * .3 + r, -r); ctx.lineTo(k * r * .3 - r, r); ctx.stroke(); } }
  if (lv === 10) { ctx.strokeStyle = D.d; ctx.lineWidth = r * .1; for (let k = -2; k <= 2; k++) { ctx.beginPath(); for (let yy = -r; yy <= r; yy += r * .1) ctx.lineTo(k * r * .4 + Math.sin(yy * .25) * r * .05, yy); ctx.stroke(); } }
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(-r * .38, -r * .45, r * .28, r * .14, -.6, 0, TAU); ctx.fill();
  ctx.restore();
  if (lv === 3) { ctx.fillStyle = '#4D7C0F'; for (let k = 0; k < 4; k++) { ctx.save(); ctx.rotate(k * PI / 2 + PI / 4); ctx.beginPath(); ctx.ellipse(0, -r * .95, r * .22, r * .12, 0, 0, TAU); ctx.fill(); ctx.restore(); } }
  if (lv === 8) { ctx.fillStyle = '#16A34A'; for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(k * r * .12 - r * .08, -r * .9); ctx.lineTo(k * r * .22, -r * 1.45 + Math.abs(k) * r * .12); ctx.lineTo(k * r * .12 + r * .08, -r * .9); ctx.fill(); } }
  if ([0, 4, 5, 6, 7].includes(lv)) { ctx.strokeStyle = '#6B4423'; ctx.lineWidth = Math.max(2, r * .07); ctx.beginPath(); ctx.moveTo(0, -r * .92); ctx.lineTo(r * .06, -r * 1.12); ctx.stroke(); if (lv >= 4) { ctx.fillStyle = '#22A34A'; ctx.beginPath(); ctx.ellipse(r * .22, -r * 1.06, r * .2, r * .09, -.4, 0, TAU); ctx.fill(); } }
  face(r, lv, sleepy);
  ctx.restore();
}
function drawBox() {
  ctx.fillStyle = 'rgba(90,58,30,.08)'; rrect(BOX.l - 14, BOX.t - 10, BOX.r - BOX.l + 28, BOX.b - BOX.t + 26, 26); ctx.fill();
  const g = ctx.createLinearGradient(0, BOX.t, 0, BOX.b); g.addColorStop(0, '#FFF6E2'); g.addColorStop(1, '#FBE3B8');
  ctx.fillStyle = g; rrect(BOX.l, BOX.t, BOX.r - BOX.l, BOX.b - BOX.t, 18); ctx.fill();
  ctx.strokeStyle = '#C08A4B'; ctx.lineWidth = 6; rrect(BOX.l - 3, BOX.t - 3, BOX.r - BOX.l + 6, BOX.b - BOX.t + 6, 20); ctx.stroke();
  ctx.strokeStyle = 'rgba(192,138,75,.25)'; ctx.lineWidth = 2; for (let x = BOX.l + 40; x < BOX.r; x += 40) { ctx.beginPath(); ctx.moveTo(x, BOX.t + 8); ctx.lineTo(x, BOX.b - 8); ctx.stroke(); }
  const danger = warn > 0;
  ctx.setLineDash([10, 8]); ctx.strokeStyle = danger ? `rgba(229,72,77,${.5 + .5 * Math.sin(T * 14)})` : 'rgba(192,138,75,.55)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(BOX.l + 6, LINE); ctx.lineTo(BOX.r - 6, LINE); ctx.stroke(); ctx.setLineDash([]);
}
function hud() {
  text(String(score), 62, 70, 52, '#fff', { align: 'left', stroke: '#5A3A1E', sw: 10 });
  text('Terbaik ' + SAVE.best, 64, 112, 18, '#8A5A2B', { align: 'left', weight: 700 });
  ctx.fillStyle = 'rgba(255,255,255,.7)'; circle(402, 88, 40); text('Berikutnya', 402, 140, 15, '#8A5A2B', { weight: 700 });
  const nr = Math.min(F[nextLv].r, 30); drawFruit(nextLv, 402, 88, nr, 0);
  // fruit ladder, tap a known fruit to read about it
  for (let i = 0; i < F.length; i++) {
    const x = 40 + i * 40, y = 818, r = 14;
    if (SAVE.seen[i]) drawFruit(i, x, y, r, 0); else { ctx.fillStyle = 'rgba(90,58,30,.18)'; circle(x, y, r); text('?', x, y + 1, 14, 'rgba(90,58,30,.45)'); }
    if (i < F.length - 1) { ctx.fillStyle = 'rgba(90,58,30,.35)'; circle(x + 20, y, 2); }
  }
}
function render() {
  ctx.setTransform(SC * DPR, 0, 0, SC * DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.save(); if (shake > 0 && !REDUCED) ctx.translate(rnd(-6, 6) * shake, rnd(-6, 6) * shake);
  drawBox();
  if (held && state === 'play') {
    const r = F[held.lv].r, x = clamp(aimX, BOX.l + r, BOX.r - r), ready = cool <= 0;
    ctx.strokeStyle = 'rgba(90,58,30,.25)'; ctx.lineWidth = 2; ctx.setLineDash([6, 8]); ctx.beginPath(); ctx.moveTo(x, LINE - 40 + r); ctx.lineTo(x, BOX.b); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = ready ? 1 : .5; drawFruit(held.lv, x, LINE - 40, r, 0); ctx.globalAlpha = 1;
  }
  for (const f of fruits) drawFruit(f.lv, f.x, f.y, f.r, f.rot, Math.max(0, 1 - (T - f.born) * 3) * (f.r < f.tr - 1 ? 1 : 0), state === 'over');
  for (const p of parts) { ctx.globalAlpha = clamp((1 - p.t / p.life) * 1.4, 0, 1); ctx.fillStyle = p.col; if (p.conf) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); } else circle(p.x, p.y, p.r); }
  ctx.globalAlpha = 1;
  for (const f of floats) { ctx.globalAlpha = clamp(1.3 - f.t, 0, 1); text(f.s, f.x, f.y, 30, f.col, { stroke: '#5A3A1E', sw: 7 }); }
  ctx.globalAlpha = 1; ctx.restore();
  hud();
  if (state === 'over' && !fruits.length && endT > popDone + .5) {
    ctx.fillStyle = 'rgba(90,58,30,.45)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#FFF9EC'; rrect(70, 280, 340, 300, 28); ctx.fill(); ctx.strokeStyle = '#F2C14E'; ctx.lineWidth = 4; ctx.stroke();
    text('Kotaknya penuh!', 240, 330, 34, '#C2410C');
    text(String(score), 240, 395, 64, '#5A3A1E');
    text(score >= SAVE.best && score > 0 ? 'Skor terbaik baru!' : 'Terbaik: ' + SAVE.best, 240, 448, 20, '#8A5A2B', { weight: 700 });
    ctx.fillStyle = '#22A34A'; rrect(150, 486, 180, 60, 30); ctx.fill(); text('Main lagi', 240, 518, 28, '#fff');
  }
}

// ---------- update ----------
function update(dt) {
  T += dt; shake = Math.max(0, shake - dt); if (comboT > 0) comboT -= dt;
  for (const p of parts) { p.t += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.conf) p.rot += p.vr * dt; }
  parts = parts.filter((p) => p.t < p.life); for (const f of floats) { f.t += dt; f.y -= 50 * dt; } floats = floats.filter((f) => f.t < 1.3);
  if (state === 'play') {
    physics(dt);
    if (cool > 0) { cool -= dt; if (cool <= 0 && !held) { held = { lv: nextLv }; nextLv = pickLevel(); } }
    warn = 0;
    for (const f of fruits) {
      const settled = T - f.born > 1.2;
      if (settled && f.y - f.r < LINE + 30) warn = 1;
      if (settled && f.y - f.r < LINE) { f.over += dt; if (f.over > 2) gameOver(); } else f.over = 0;
    }
  } else if (state === 'over') { // like the original: every fruit pops one by one and adds its points
    endT += dt;
    if (fruits.length && endT > .4 && (endT * 12 | 0) !== ((endT - dt) * 12 | 0)) {
      fruits.sort((a, b) => a.y - b.y); const f = fruits.shift(); if (!fruits.length) popDone = endT; score += f.lv + 1; burst(f.x, f.y, F[f.lv].c, 8, 160); sfx.pop();
      if (!fruits.length) { SAVE.best = Math.max(SAVE.best, score); store(); popDone = endT; }
    }
  }
}
function gameOver() { if (state !== 'play') return; state = 'over'; endT = 0; popDone = 99; held = null; sfx.over(); buzz(40); }

// ---------- input: drag to aim, release to drop; a tap drops right there ----------
function toX(e) { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
function toY(e) { const r = cv.getBoundingClientRect(); return (e.clientY - r.top) / r.height * H; }
let aiming = null;
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault(); tone(0, 0); const x = toX(e), y = toY(e);
  if (state === 'over') { if (!fruits.length && endT > popDone + .5 && x > 150 && x < 330 && y > 486 && y < 546) newGame(); return; }
  if (y > 790) { const i = Math.round((x - 40) / 40); if (i >= 0 && i < F.length && SAVE.seen[i]) toast(`<b>${F[i].n}</b>. ${F[i].f}`); return; }
  aiming = e.pointerId; aimX = x; cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', (e) => { if (aiming === e.pointerId || e.pointerType === 'mouse') aimX = toX(e); });
cv.addEventListener('pointerup', (e) => { if (aiming !== e.pointerId) return; aiming = null; aimX = toX(e); drop(); });
cv.addEventListener('pointercancel', () => { aiming = null; });
addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft') aimX -= 24; else if (e.code === 'ArrowRight') aimX += 24;
  else if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'Enter') { e.preventDefault(); if (state === 'over' && !fruits.length) newGame(); else drop(); }
  aimX = clamp(aimX, BOX.l, BOX.r);
});
document.addEventListener('visibilitychange', () => { if (AC) document.hidden ? AC.suspend() : AC.resume(); last = performance.now(); });

// ---------- loop ----------
let last = 0, acc = 0;
function frame(ts) { requestAnimationFrame(frame); const d = Math.min(.1, Math.max(0, (ts - last) / 1000)); last = ts; acc += d; while (acc >= STEP) { update(STEP); acc -= STEP; } render(); }
newGame(); requestAnimationFrame(frame);
window.__buah = { get fruits() { return fruits; }, get state() { return state; }, get score() { return score; }, drop, set aim(v) { aimX = v; }, F, makeFruit, push: (f) => fruits.push(f), SAVE };
</script>
