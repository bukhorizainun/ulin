<body>
<canvas id="c"></canvas>
<script>
'use strict';
// Mael ke Linz: a birthday football runner. Everything is drawn in code, no external assets.
const W = 960, H = 540, GY = 440, MX = 210, L = 6400;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let SC = 1, DPR = 1;
function resize() {
  SC = Math.min(innerWidth / W, innerHeight / H);
  DPR = Math.min(devicePixelRatio || 1, 2);
  cv.style.width = W * SC + 'px'; cv.style.height = H * SC + 'px';
  cv.width = Math.round(W * SC * DPR); cv.height = Math.round(H * SC * DPR);
}
addEventListener('resize', resize); resize();

const FONT = '"Baloo 2", system-ui, sans-serif';
const PI = Math.PI, TAU = PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const hsh = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = (k) => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
const ID_FLAG = ['#E70011', '#FFFFFF'], AT_FLAG = ['#EF3340', '#FFFFFF', '#EF3340'];
const CANDLE_COLS = ['#FF8FAB', '#7FB3FF', '#B8F28B', '#FFD23F', '#C3A6FF', '#FFB38A', '#7FE3D4'];
let T = 0;

// ---------- sound (synthesized) ----------
let AC = null, OUT = null, NB = null, muted = false;
function audioInit() {
  if (!AC) {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    AC = new A(); OUT = AC.createGain(); OUT.gain.value = .55; OUT.connect(AC.destination);
    NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state !== 'running') AC.resume();
}
function tone(f, dur, type = 'square', vol = .15, to = 0, delay = 0) {
  if (!AC || muted) return;
  const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(OUT); o.start(t0); o.stop(t0 + dur + .05);
}
function noise(dur, vol = .2, freq = 1000, delay = 0, attack = .01) {
  if (!AC || muted) return;
  const t0 = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NB; s.loop = true; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = .7;
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + attack); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(OUT); s.start(t0); s.stop(t0 + dur + .05);
}
const sfx = {
  jump() { tone(330, .16, 'square', .07, 700); },
  star() { tone(1318, .07, 'square', .05); tone(1760, .12, 'square', .05, 0, .06); },
  candle() { [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, .3, 'triangle', .16, 0, i * .06)); },
  bump() { tone(180, .2, 'sine', .3, 60); noise(.12, .1, 400); },
  kick() { tone(140, .14, 'sine', .5, 45); noise(.07, .2, 2500); },
  whistle() { tone(2600, .12, 'sine', .1); tone(2600, .35, 'sine', .1, 2450, .16); },
  cheer() { noise(1.8, .28, 900, 0, .3); noise(1.4, .1, 2400, .1, .2); },
  save() { tone(300, .25, 'triangle', .15, 180); },
  pop() { tone(500, .08, 'square', .04, 1100); noise(.25, .06, 3000, .05); },
};
const NOTE = { G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };
const HB = 'G4 .3,G4 .1,A4 .4,G4 .4,C5 .4,B4 .8,G4 .3,G4 .1,A4 .4,G4 .4,D5 .4,C5 .8,G4 .3,G4 .1,G5 .4,E5 .4,C5 .4,B4 .4,A4 .8,F5 .3,F5 .1,E5 .4,C5 .4,D5 .4,C5 1.2'
  .split(',').map((s) => s.split(' '));
function playHB() {
  let t = 0; const sp = 1.1;
  for (const [n, d] of HB) { const dur = +d * sp; tone(NOTE[n], dur * .95 + .1, 'triangle', .22, 0, t); tone(NOTE[n] / 2, dur * .9 + .1, 'sine', .08, 0, t); t += dur; }
  return t;
}
let voice = null; // optional recorded message: put ayah.mp3 next to this file
fetch('ayah.mp3', { method: 'HEAD' }).then((r) => { if (r.ok) { voice = new Audio('ayah.mp3'); voice.preload = 'auto'; } }).catch(() => {});

// Family photos are not in this public repo. They load from a private host when the
// shared link carries #k=<key>; the key is remembered on that tablet.
const PH = {};
(() => {
  let k = (location.hash.match(/k=([\w-]+)/) || [])[1];
  try { if (k) localStorage.setItem('mael-k', k); else k = localStorage.getItem('mael-k'); } catch (_) {}
  if (!k) return;
  for (const [n, f] of [['mael', 'face_mael.png'], ['baba', 'face_baba.png'], ['ibu', 'face_ibu.png'], ['keluarga', 'keluarga.jpg']]) {
    const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => { PH[n] = im; }; im.src = `https://mael-foto.zainun.workers.dev/${k}/${f}`;
  }
})();

// ---------- drawing helpers ----------
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function text(s, x, y, size, color, o = {}) {
  ctx.font = `${o.weight || 800} ${size}px ${FONT}`; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.sw || size * .18; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function rep(off, sp, fn) { const o = ((off % sp) + sp) % sp, b = Math.floor(off / sp); for (let i = -1; i <= Math.ceil(W / sp) + 1; i++) fn(i * sp - o, b + i); }
function sky(c1, c2, bottom = GY) { const g = ctx.createLinearGradient(0, 0, 0, bottom); g.addColorStop(0, c1); g.addColorStop(1, c2); ctx.fillStyle = g; ctx.fillRect(0, 0, W, bottom + 2); }
function sun(x, y, r, col) { ctx.fillStyle = col; ctx.globalAlpha = .25; circle(x, y, r * 1.7); ctx.globalAlpha = 1; circle(x, y, r); }
function cloud(x, y, s) { circle(x, y, 24 * s); circle(x + 28 * s, y - 12 * s, 30 * s); circle(x + 58 * s, y, 22 * s); ctx.fillRect(x, y - 2, 58 * s, 24 * s); }
function clouds(off, a = 1) { ctx.fillStyle = `rgba(255,255,255,${.85 * a})`; rep(off, 360, (x, k) => cloud(x + hsh(k) * 120, 60 + hsh(k + 7) * 110, .7 + hsh(k + 3) * .6)); }
function hills(off, col, base, amp, fr) { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, GY); for (let x = 0; x <= W; x += 12) ctx.lineTo(x, base - amp * Math.sin((x + off) * fr) - amp * .5 * Math.sin((x + off) * fr * 2.3 + 1)); ctx.lineTo(W, GY); ctx.fill(); }
function poly(x, y, r, n, a0) { ctx.beginPath(); for (let i = 0; i < n; i++) { const a = a0 + i * TAU / n; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } ctx.closePath(); ctx.fill(); }
function miniFlag(x, y, cols) { const h = 22 / cols.length; cols.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(x, y + i * h, 32, h); }); ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1; ctx.strokeRect(x, y, 32, 22); }

function drawBall(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#fff'; circle(0, 0, r);
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip(); ctx.fillStyle = '#2B2D42';
  poly(0, 0, r * .38, 5, -PI / 2);
  for (let i = 0; i < 5; i++) { const a = -PI / 2 + i * TAU / 5 + PI / 5; poly(Math.cos(a) * r * 1.02, Math.sin(a) * r * 1.02, r * .38, 5, a); }
  ctx.restore();
  ctx.strokeStyle = '#2B2D42'; ctx.lineWidth = Math.max(1.5, r * .12); ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
  ctx.restore();
}
function star(x, y, r) {
  ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -PI / 2 + i * PI / 5, rr = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fillStyle = '#FFD23F'; ctx.fill(); ctx.strokeStyle = '#F4A300'; ctx.lineWidth = 2.5; ctx.stroke();
}
function candle(x, y, h, lit, col, flick = 0) {
  ctx.fillStyle = col; rrect(x - 6, y - h, 12, h, 3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)'; for (let i = 0; i < h / 10 - 1; i++) ctx.fillRect(x - 6, y - h + 5 + i * 10, 12, 3);
  ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, y - h); ctx.lineTo(x, y - h - 6); ctx.stroke();
  if (!lit) return;
  const f = 1 + Math.sin(T * 18 + flick) * .12;
  ctx.fillStyle = 'rgba(255,200,80,.25)'; circle(x, y - h - 14, 16 * f);
  ctx.fillStyle = '#FFB703'; ctx.beginPath(); ctx.ellipse(x, y - h - 13, 6 * f, 11 * f, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#FFF3B0'; ctx.beginPath(); ctx.ellipse(x, y - h - 11, 3 * f, 6 * f, 0, 0, TAU); ctx.fill();
}

// Kid figure. Angles are measured from straight down, positive toward the front.
function kid(x, y, o = {}) {
  const pose = o.pose || 'run', face = o.face || 1, ph = o.ph || 0;
  const skin = o.skin || '#C68B59', skin2 = o.skin2 || '#A8713F', jersey = o.jersey || '#E63946', hair = o.hair || '#1F1A17';
  const who = o.who === undefined ? 'mael' : o.who;
  let lf = Math.sin(ph) * .75, lb = -lf, af = -lf * .9, ab = lf * .9;
  if (pose === 'air') { lf = .7; lb = -.4; af = 2.4; ab = -.9; }
  else if (pose === 'stand') { lf = .1; lb = -.1; af = .2; ab = -.2; }
  else if (pose === 'kick') { lf = 1.25; lb = -.2; af = -.7; ab = 1.0; }
  else if (pose === 'happy') { lf = .25; lb = -.25; af = 2.7; ab = -2.7; y -= Math.abs(Math.sin(T * 7)) * 22; }
  else if (pose === 'keeper') { lf = .35; lb = -.35; af = 2.2; ab = -2.2; }
  ctx.save(); ctx.translate(x, y); ctx.scale(face, 1); ctx.lineCap = 'round';
  const limb = (ox, oy, a, len, col, w) => { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(ox, oy); const ex = ox + Math.sin(a) * len, ey = oy + Math.cos(a) * len; ctx.lineTo(ex, ey); ctx.stroke(); return [ex, ey]; };
  const leg = (a, col) => {
    const [fx, fy] = limb(0, -46, a, 42, col, 10), s = Math.sin(a), c = Math.cos(a);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(s * 26, -46 + c * 26); ctx.lineTo(fx, fy); ctx.stroke();
    ctx.strokeStyle = jersey; ctx.beginPath(); ctx.moveTo(s * 26, -46 + c * 26); ctx.lineTo(s * 30, -46 + c * 30); ctx.stroke();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.ellipse(fx + 4, fy, 9, 5.5, 0, 0, TAU); ctx.fill();
  };
  const arm = (a, col) => { const [hx, hy] = limb(0, -80, a, 30, col, 8); if (o.gloves) { ctx.fillStyle = '#fff'; circle(hx, hy, 7); } };
  arm(ab, skin2); leg(lb, skin2);
  ctx.fillStyle = '#fff'; rrect(-14, -56, 28, 16, 5); ctx.fill();
  ctx.fillStyle = jersey; rrect(-15, -90, 30, 40, 10); ctx.fill();
  if (o.stripes) { ctx.save(); rrect(-15, -90, 30, 40, 10); ctx.clip(); ctx.fillStyle = o.stripes; for (let i = -12; i < 15; i += 12) ctx.fillRect(i, -90, 6, 40); ctx.restore(); }
  ctx.save(); ctx.scale(face, 1); text(o.num || '7', 0, -70, 20, o.numCol || '#fff', o.stripes ? { stroke: '#1D3557', sw: 4 } : {}); ctx.restore();
  leg(lf, skin); arm(af, skin);
  ctx.fillStyle = jersey; circle(0, -80, 7);
  if (bigHead(o.toon, who, face)) { ctx.restore(); return; }
  ctx.fillStyle = skin; circle(2, -108, 19);
  ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(0, -112, 20, PI * .85, PI * 2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = skin2; circle(-6, -106, 5);
  ctx.fillStyle = '#222'; circle(11, -107, 2.6);
  ctx.strokeStyle = '#5A2E1A'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(10, -101, 6, .15 * PI, .8 * PI); ctx.stroke();
  ctx.fillStyle = 'rgba(255,110,110,.35)'; circle(5, -100, 4.5);
  ctx.restore();
}

// Big heads: a family photo (round PNG) or a drawn caricature of a star player.
function bigHead(toon, who, face) {
  const im = who && PH[who], cy = -122;
  if (im && !toon) {
    ctx.save(); ctx.scale(face, 1);
    ctx.fillStyle = '#fff'; circle(0, cy, 32); ctx.drawImage(im, -29, cy - 29, 58, 58);
    ctx.restore(); return true;
  }
  if (!toon) return false;
  const R = 27, sk = toon === 'mbappe' ? '#6B4226' : '#C08A5B', dk = toon === 'mbappe' ? '#55331C' : '#9E6F45';
  ctx.fillStyle = dk; circle(-R + 4, cy + 3, 7);
  ctx.fillStyle = sk; circle(0, cy, R);
  if (toon === 'mbappe') {
    ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.beginPath(); ctx.ellipse(-4, cy - 17, 11, 5, -.3, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(25,12,4,.35)'; ctx.beginPath(); ctx.ellipse(8, cy + 15, 15, 9, 0, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = '#1B1410';
    for (let i = 0; i < 9; i++) { const a = PI * 1.02 + i * PI * .12; circle(Math.cos(a) * R * .82, cy - 4 + Math.sin(a) * R * .82, 8.5); }
    circle(-6, cy - 24, 10); circle(8, cy - 25, 9); circle(-16, cy - 16, 8);
  }
  ctx.fillStyle = '#fff'; circle(8, cy - 3, 6); circle(20, cy - 3, 5);
  ctx.fillStyle = '#1A1A1A'; circle(10, cy - 3, 3); circle(21, cy - 3, 2.6);
  ctx.strokeStyle = '#1A1008'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(3, cy - 12); ctx.lineTo(13, cy - 13); ctx.moveTo(17, cy - 12); ctx.lineTo(24, cy - 11); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(14, cy + 8, 8, .1 * PI, .9 * PI); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#3A2010'; ctx.lineWidth = 2; ctx.stroke();
  return true;
}
const BUD = {
  mbappe: { name: 'Kylian Mbappé', nick: 'Si Kilat', toon: 'mbappe', jersey: '#F4F4F4', num: '10', numCol: '#C9A227', skin: '#6B4226', skin2: '#55331C', power: 'TURBO KILAT!', col: '#4EA8DE' },
  yamal: { name: 'Lamine Yamal', nick: 'Si Ajaib', toon: 'yamal', jersey: '#A50044', stripes: '#004D98', num: '10', numCol: '#FFD23F', skin: '#C08A5B', skin2: '#9E6F45', power: 'MAGNET AJAIB!', col: '#FF8FAB' },
};
const budKid = (b, x, y, o = {}) => kid(x, y, Object.assign({ who: null, toon: b.toon, jersey: b.jersey, stripes: b.stripes, num: b.num, numCol: b.numCol, skin: b.skin, skin2: b.skin2 }, o));

// ---------- scenery ----------
function palm(x, y, s) {
  ctx.strokeStyle = '#8B5A2B'; ctx.lineWidth = 10 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 4 * s, y - 80 * s, x + 22 * s, y - 150 * s); ctx.stroke();
  const tx = x + 22 * s, ty = y - 150 * s, sway = Math.sin(T * 1.5 + x * .01) * .08;
  ctx.fillStyle = '#2E9E55';
  for (let i = 0; i < 6; i++) { const a = -PI / 2 + (i - 2.5) * .55 + sway; ctx.save(); ctx.translate(tx, ty); ctx.rotate(a); ctx.beginPath(); ctx.ellipse(34 * s, 0, 36 * s, 9 * s, 0, 0, TAU); ctx.fill(); ctx.restore(); }
  ctx.fillStyle = '#6B4423'; circle(tx - 5 * s, ty + 6 * s, 6 * s); circle(tx + 6 * s, ty + 7 * s, 6 * s);
}
function house(x, y, v) {
  ctx.fillStyle = '#7A5230'; ctx.fillRect(x + 6, y - 14, 6, 14); ctx.fillRect(x + 98, y - 14, 6, 14);
  ctx.fillStyle = ['#F7E6C4', '#F2CFA6', '#E3EFD3'][Math.floor(v * 3) % 3]; ctx.fillRect(x, y - 70, 110, 56);
  ctx.fillStyle = '#C8553D'; ctx.beginPath(); ctx.moveTo(x - 14, y - 68); ctx.lineTo(x + 124, y - 68); ctx.lineTo(x + 92, y - 108); ctx.lineTo(x + 18, y - 108); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#7A5230'; ctx.fillRect(x + 46, y - 52, 20, 38);
  ctx.fillStyle = '#6FB7E0'; ctx.fillRect(x + 12, y - 56, 22, 18); ctx.fillRect(x + 78, y - 56, 22, 18);
}
function flag(x, y, cols) {
  ctx.fillStyle = '#9AA3AD'; ctx.fillRect(x, y - 150, 4, 150);
  const n = cols.length, w = 54, h = 36;
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = cols[i]; ctx.beginPath(); const y0 = y - 148 + i * h / n;
    for (let j = 0; j <= 10; j++) ctx.lineTo(x + 4 + j * w / 10, y0 + Math.sin(T * 4 + j * .6) * 2.5);
    for (let j = 10; j >= 0; j--) ctx.lineTo(x + 4 + j * w / 10, y0 + h / n + Math.sin(T * 4 + j * .6) * 2.5);
    ctx.fill();
  }
}
function umbrella(x, y) {
  ctx.fillStyle = '#ddd'; ctx.fillRect(x - 2, y - 100, 4, 100);
  for (let i = 0; i < 6; i++) { ctx.fillStyle = i % 2 ? '#fff' : '#E63946'; ctx.beginPath(); ctx.moveTo(x, y - 100); ctx.arc(x, y - 100, 62, PI + i * PI / 6, PI + (i + 1) * PI / 6); ctx.closePath(); ctx.fill(); }
}
function mountains(off, col, peak, vr, sp) {
  rep(off, sp, (x, k) => {
    const cx = x + sp / 2, py = peak + hsh(k) * vr, w = sp * .72, d = GY - py, sh = d * .26, hw = w * sh / d;
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(cx - w, GY); ctx.lineTo(cx, py); ctx.lineTo(cx + w, GY); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(cx, py); ctx.lineTo(cx + hw, py + sh); ctx.lineTo(cx + 8, py + sh * .75); ctx.lineTo(cx - 6, py + sh); ctx.lineTo(cx - hw, py + sh * .8); ctx.closePath(); ctx.fill();
  });
}
function pine(x, y, s) {
  ctx.fillStyle = '#6B4423'; ctx.fillRect(x - 4 * s, y - 18 * s, 8 * s, 18 * s);
  for (let i = 0; i < 3; i++) {
    const by = y - 14 * s - i * 30 * s, hw = (34 - i * 8) * s;
    ctx.fillStyle = '#2F6B4F'; ctx.beginPath(); ctx.moveTo(x - hw, by); ctx.lineTo(x, by - 46 * s); ctx.lineTo(x + hw, by); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x - hw * .35, by - 30 * s); ctx.lineTo(x, by - 46 * s); ctx.lineTo(x + hw * .35, by - 30 * s); ctx.fill();
  }
}
function chalet(x, y) {
  ctx.fillStyle = '#A0643A'; ctx.fillRect(x, y - 60, 100, 60);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x - 14, y - 56); ctx.lineTo(x + 50, y - 100); ctx.lineTo(x + 114, y - 56); ctx.fill();
  ctx.fillStyle = '#FFE08A'; ctx.fillRect(x + 16, y - 44, 18, 16); ctx.fillRect(x + 66, y - 44, 18, 16);
  ctx.fillStyle = '#6B3E1F'; ctx.fillRect(x + 42, y - 36, 16, 36);

function basilica(cx, y) { // Poestlingberg church on its hill

// ---------- game state ----------
let state = 'title', st = 0, stage = 0, dist = 0, stars = 0, candles = 0, items = [], shake = 0, pen = null, fin = null, slow = 0, cards = 0;

const SKIP_TO_CAKE = location.hash === '#kue';
function go(s) {
  state = s; st = 0; if (s === 'penalty') startPenalty(); if (s === 'finale') startFinale();

}

function buildStage() {
  items = []; const S = STAGES[stage]; let x = 950, n = 0;
  while (x < L - 700) {
    const type = S.obst[n % 2], o = OB[type];
    items.push({ k: 'ob', type, x, w: o.w, h: o.h, hit: false });
    for (let i = -2; i <= 2; i++) items.push({ k: 'star', x: x + o.w / 2 + i * 40, y: GY - 150 - (2 - Math.abs(i)) * 18 });
    const gap = rnd(600, 820);
    for (let i = 0; i < 3; i++) items.push({ k: 'star', x: x + gap * .45 + i * 48, y: GY - 45 });
    x += gap; n++;
  }
  if (stage < 3) items.push({ k: 'candle', x: L * .55, y: GY - 190 });
  items.push({ k: 'pow', x: L * .22, y: GY - 120 }, { k: 'pow', x: L * .72, y: GY - 120 });
}
function startRun() { buildStage(); dist = 0; me.y = GY; me.vy = 0; me.jumps = 0; me.stumble = 0; me.pow = 0; me.combo = 0; go('run'); }
const bud = () => BUD[STAGES[stage].bud];
function jump() {
  if (me.jumps === 0 && me.y >= GY - 1) { me.vy = -780; me.jumps = 1; sfx.jump(); }
  else if (me.jumps === 1) { me.vy = -700; me.jumps = 2; sfx.jump(); }
}
function updRun(dt) {
  const turbo = me.pow > 0 && STAGES[stage].bud === 'mbappe', magnet = me.pow > 0 && STAGES[stage].bud === 'yamal';
  if (me.pow > 0) me.pow -= dt;
  const spd = (270 + stage * 15) * (me.stumble > 0 ? .5 : 1) * (turbo ? 1.7 : 1);
  dist += spd * dt; me.ph += spd * dt * .045;
  me.vy += 2200 * dt; me.y += me.vy * dt; if (me.y >= GY) { me.y = GY; me.vy = 0; me.jumps = 0; }
  if (me.stumble > 0) me.stumble -= dt;
  for (const it of items) {
    const sx = it.x - dist;
    if (it.k === 'ob') {
      if (it.fly !== undefined) { it.fly += dt; continue; }
      if (!it.hit && sx < MX + 14 && sx + it.w > MX - 14 && me.y > GY - it.h + 6) {
        it.hit = true;
        if (me.pow > 0) { it.fly = 0; shake = .2; sfx.kick(); floatText('Tembus!', MX + 40, me.y - 150, '#7FDBFF'); }
        else { me.stumble = .8; shake = .3; sfx.bump(); floatText('Ups!', MX, me.y - 150); }
      }
    } else if (it.got) continue;
    else if (it.k === 'pow') {
      if (Math.abs(sx - MX) < 50 && Math.abs(it.y - (me.y - 70)) < 80) {
        it.got = true; me.pow = 5; shake = .25; slow = .25; const b = bud();
        [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .18, 'square', .07, 0, i * .05));
        burst(MX, me.y - 80, b.col, 26, 320); floatText(b.power, 480, 170, b.col);
      }
    } else if (it.k === 'star') {
      if (magnet && Math.abs(sx - MX) < 300) { const k = Math.min(1, dt * 7); it.x += (dist + MX - it.x) * k; it.y += (me.y - 60 - it.y) * k; }
      if (Math.abs(it.x - dist - MX) < 34 && Math.abs(it.y - (me.y - 60)) < 62) {
        it.got = true; const v = magnet ? 2 : 1; stars += v;
        me.combo = T - me.lastStar < .8 ? me.combo + 1 : 1; me.lastStar = T;
        tone(1318 * Math.pow(1.06, Math.min(me.combo, 12)), .08, 'square', .05); burst(sx, it.y, '#FFD23F', 6, 160);
        if (v > 1) floatText('+2', sx, it.y - 20, '#FF8FAB');
        if (me.combo % 5 === 0) floatText('Combo x' + me.combo + '!', MX + 60, me.y - 190, '#FFD23F');
      }
    } else if (it.k === 'candle') { // the candle drifts to Mael, so it is never missed
      if (sx < MX + 360) it.mag = true;
      if (it.mag) { const k = Math.min(1, dt * 5); it.x += (dist + MX - it.x) * k; it.y += (me.y - 70 - it.y) * k; }
      if (Math.abs(it.x - dist - MX) < 26) { it.got = true; candles++; sfx.candle(); burst(MX, me.y - 70, '#FFB703', 16, 240); floatText('Lilin ke-' + candles + '!', MX + 30, me.y - 170, '#FFD23F'); }
    }
  }
  if (dist >= L) go('penalty');
}

const GX1 = 560, GX2 = 880, GTOP = 250, AIMY = 330;
function startPenalty() { pen = { phase: 'aim', t: 0, tries: 0, kx: 720, bx: 330, by: GY - 14, br: 14, p: 0, net: 0 }; sfx.whistle(); }
const aimX = () => 600 + (Math.sin(pen.t * 1.8) * .5 + .5) * 240;
function shoot(sw) {
  pen.tx = aimX(); pen.ty = AIMY + rnd(-30, 30); pen.cv = 0;
  if (sw) { // swipe: aim where the finger went, a bent swipe bends the ball
    pen.tx = clamp(sw.x1 + sw.dx * .4, GX1 + 28, GX2 - 28); pen.ty = clamp(sw.y1 + sw.dy * .4, GTOP + 28, GY - 34);
    pen.cv = clamp(sw.bend * 1.6, -130, 130);
  }
  const banana = Math.abs(pen.cv) > 30;
  if (banana) floatText('Tendangan pisang!', 480, 200, '#FF8FAB');
  pen.save = !banana && pen.tries < 2 && Math.abs(pen.kx - pen.tx) < 44; // third try always scores
  pen.kTarget = pen.save ? pen.tx : (pen.tx < 720 ? 830 : 610);
  pen.tries++; pen.phase = 'shoot'; pen.p = 0; sfx.kick();
}
function updPenalty(dt) {
  const P = pen; P.t += dt;
  if (P.phase === 'aim') P.kx = 720 + Math.sin(P.t * 1.1 + 1) * 95;

  else if (state === 'finale') updFinale(dt);
  else if (state === 'fly' && st > 3.4) go('intro');
  else if (state === 'intro' && st > 3.5) startRun();
  updParts(dt);
}
function render() {
  ctx.setTransform(SC * DPR, 0, 0, SC * DPR, 0, 0); ctx.save();
  if (shake > 0) ctx.translate(rnd(-6, 6) * shake / .3, rnd(-4, 4) * shake / .3);
  if (state === 'title') drawTitle(); else if (state === 'intro') drawIntro(); else if (state === 'run') drawRun();
  else if (state === 'fly') drawFly(); else if (state === 'penalty') drawPenalty(); else if (state === 'card') drawCard(); else drawFinale();
  for (const f of floats) { ctx.globalAlpha = clamp(1 - f.t / 1.3, 0, 1); text(f.s, f.x, f.y, 36, f.col, { stroke: '#1D3557', sw: 8 }); }
  ctx.globalAlpha = 1;
  if (state === 'title' || state === 'finale') muteBtn();
  ctx.restore();
}
let lastT = 0;
function frame(ts) { requestAnimationFrame(frame); const dt = Math.min(.033, Math.max(0, (ts - lastT) / 1000)); lastT = ts; update(dt); render(); }
requestAnimationFrame(frame);

function goFull() {
  const el = document.documentElement, fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!fn) return;
  try { const r = fn.call(el); if (r && r.then) r.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {}); } catch (_) {}
}
function tap(x, y) {
  if ((state === 'title' || state === 'finale') && Math.hypot(x - 922, y - 36) < 30) { muted = !muted; return; }
  audioInit();
  if (state === 'title') { if (st > .2) { goFull(); if (SKIP_TO_CAKE) { stage = 3; candles = 7; go('finale'); } else go('intro'); } }
  else if (state === 'intro') { if (st > .5) startRun(); }
  else if (state === 'fly') { if (st > 1.2) go('intro'); }
  else if (state === 'run') jump();
  else if (state === 'penalty') { if (pen.phase === 'aim' && st > .7) shoot(); }
  else if (state === 'card') { if (st > 1.6) nextStage(); }
  else if (state === 'finale') {
    if (fin.phase === 'blow') blow();
    else if (fin.phase === 'done' && fin.msg > .8) { const cx = PH.keluarga ? 560 : 480; if (Math.abs(x - cx) < 80 && y > 250 && y < 298) restart(); }
  }
}
let swipe = null;
const toXY = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
addEventListener('pointerdown', (e) => {
  e.preventDefault(); const [x, y] = toXY(e);
  if (state === 'penalty' && pen.phase === 'aim' && st > .7) { audioInit(); swipe = { pts: [[x, y]] }; return; }
  tap(x, y);
}, { passive: false });
addEventListener('pointermove', (e) => { if (swipe) swipe.pts.push(toXY(e)); });
addEventListener('pointerup', () => {
  if (!swipe) return; const P = swipe.pts; swipe = null;
  if (state !== 'penalty' || pen.phase !== 'aim') return;
  const [x0, y0] = P[0], [x1, y1] = P[P.length - 1], dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy);
  if (d < 40) { shoot(); return; } // a plain tap still shoots with the moving aim
  const [mx, my] = P[Math.floor(P.length / 2)], bend = ((mx - x0) * dy - (my - y0) * dx) / d;
  shoot({ x1, y1, dx, dy, bend });
});
addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) tap(W / 2, H / 2); } });
addEventListener('dblclick', (e) => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (AC) document.hidden ? AC.suspend() : (!muted && AC.resume()); });
</script>
